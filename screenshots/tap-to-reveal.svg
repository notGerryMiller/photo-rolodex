<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cardShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0A2540" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="#EEF1F6"/>

  <!-- BEFORE card -->
  <rect x="24" y="30" width="272" height="400" rx="16" fill="#FFFFFF" stroke="#D9D9E3" stroke-width="1" filter="url(#cardShadow2)"/>
  <!-- header -->
  <circle cx="56" cy="58" r="14" fill="#F8F8FC" stroke="#D9D9E3"/>
  <path d="M60 52 L52 58 L60 64" fill="none" stroke="#3D444D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="264" y="63" text-anchor="end" font-size="12.5" fill="#6B7280">3 / 12</text>

  <!-- avatar placeholder -->
  <circle cx="160" cy="170" r="72" fill="#E4EAF2"/>
  <circle cx="160" cy="148" r="26" fill="#B9C6D6"/>
  <path d="M108 220 a52 52 0 0 1 104 0 z" fill="#B9C6D6"/>

  <rect x="52" y="270" width="216" height="46" rx="8" fill="#FFFFFF" stroke="#4E90C4" stroke-width="1.6"/>
  <text x="160" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#4E90C4">Tap to Reveal Name</text>

  <text x="160" y="356" text-anchor="middle" font-size="12" fill="#97A9BA">before</text>

  <!-- arrow between -->
  <g transform="translate(296,230)">
    <path d="M0 0 L48 0" stroke="#97A9BA" stroke-width="2.5" stroke-dasharray="5 5" fill="none"/>
    <path d="M40 -7 L48 0 L40 7" fill="none" stroke="#97A9BA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="-12" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="600">tap</text>
  </g>

  <!-- AFTER card -->
  <rect x="344" y="30" width="272" height="400" rx="16" fill="#FFFFFF" stroke="#D9D9E3" stroke-width="1" filter="url(#cardShadow2)"/>
  <circle cx="376" cy="58" r="14" fill="#F8F8FC" stroke="#D9D9E3"/>
  <path d="M380 52 L372 58 L380 64" fill="none" stroke="#3D444D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="584" y="63" text-anchor="end" font-size="12.5" fill="#6B7280">3 / 12</text>

  <circle cx="480" cy="170" r="72" fill="#E4EAF2"/>
  <circle cx="480" cy="148" r="26" fill="#B9C6D6"/>
  <path d="M428 220 a52 52 0 0 1 104 0 z" fill="#B9C6D6"/>

  <text x="480" y="272" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">Ted Decker</text>

  <rect x="372" y="288" width="216" height="24" rx="6" fill="#F8F8FC" stroke="#D9D9E3" stroke-width="1"/>
  <text x="480" y="304" text-anchor="middle" font-size="11" fill="#6B7280">More about Ted &#9662;</text>

  <rect x="372" y="336" width="216" height="46" rx="8" fill="#2FAE7A"/>
  <text x="480" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Next &#8594;</text>

  <text x="480" y="410" text-anchor="middle" font-size="12" fill="#97A9BA">after</text>

  <text x="320" y="460" text-anchor="middle" font-size="11.5" fill="#97A9BA">Tap to Reveal mode &#183; native &lt;details&gt;/&lt;summary&gt; flip, no HTMX needed for the reveal itself</text>
</svg>
