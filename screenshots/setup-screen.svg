<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0A2540" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="560" fill="#EEF1F6"/>

  <!-- card -->
  <rect x="40" y="30" width="560" height="500" rx="16" fill="#FFFFFF" stroke="#D9D9E3" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- icon -->
  <g transform="translate(320,80)">
    <rect x="-28" y="-22" width="56" height="44" rx="6" fill="none" stroke="#4E90C4" stroke-width="3"/>
    <circle cx="-10" cy="-6" r="6" fill="none" stroke="#4E90C4" stroke-width="3"/>
    <line x1="-22" y1="12" x2="2" y2="12" stroke="#4E90C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="-10" x2="18" y2="-10" stroke="#4E90C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="-2" x2="18" y2="-2" stroke="#4E90C4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="320" y="128" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2937">Photo Rolodex</text>
  <text x="320" y="150" text-anchor="middle" font-size="13.5" fill="#6B7280">Learn names by face, one person at a time.</text>

  <!-- List field -->
  <text x="80" y="196" font-size="12.5" font-weight="600" fill="#3D444D">List</text>
  <rect x="80" y="204" width="480" height="42" rx="6" fill="#FFFFFF" stroke="#D9D9E3" stroke-width="1.5"/>
  <text x="98" y="230" font-size="13.5" fill="#1F2937">New Staff 2026</text>
  <circle cx="524" cy="225" r="8" fill="#F8F8FC" stroke="#D9D9E3"/>
  <text x="524" y="229" text-anchor="middle" font-size="11" fill="#6B7280">&#10005;</text>
  <path d="M544 221 L550 227 L556 221" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Game Mode toggle -->
  <text x="80" y="278" font-size="12.5" font-weight="600" fill="#3D444D">Game Mode</text>
  <g transform="translate(80,288)">
    <rect x="0" y="0" width="228" height="40" rx="6" fill="#4E90C4"/>
    <g transform="translate(56,13)" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 6 C2.5 1.5 6 -1 9.5 -1 C13 -1 16.5 1.5 19 6 C16.5 10.5 13 13 9.5 13 C6 13 2.5 10.5 0 6 Z"/>
      <circle cx="9.5" cy="6" r="3" fill="#FFFFFF" stroke="none"/>
    </g>
    <text x="81" y="25" text-anchor="start" font-size="13" font-weight="600" fill="#FFFFFF">Tap to Reveal</text>
    <rect x="236" y="0" width="244" height="40" rx="6" fill="#FFFFFF" stroke="#D9D9E3" stroke-width="1.5"/>
    <text x="358" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#3D444D">&#9776; Multiple Choice</text>
  </g>

  <!-- checkboxes -->
  <g transform="translate(80,356)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#4E90C4"/>
    <path d="M4 9 L8 13 L14 4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="14" font-size="13" fill="#3D444D">Track score (Multiple Choice only)</text>
  </g>
  <g transform="translate(80,388)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#4E90C4"/>
    <path d="M4 9 L8 13 L14 4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="14" font-size="13" fill="#3D444D">Show more about each person (household, campus, etc.) after answering</text>
  </g>

  <!-- start button -->
  <rect x="80" y="440" width="480" height="52" rx="8" fill="#4E90C4"/>
  <text x="320" y="472" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">&#9654; Start</text>

  <text x="320" y="518" text-anchor="middle" font-size="11.5" fill="#97A9BA">Setup screen &#183; dropdown is built live from active Rock Tags</text>
</svg>
