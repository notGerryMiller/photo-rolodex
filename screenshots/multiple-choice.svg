<svg viewBox="0 0 640 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cardShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0A2540" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="600" fill="#EEF1F6"/>

  <rect x="40" y="30" width="560" height="540" rx="16" fill="#FFFFFF" stroke="#D9D9E3" stroke-width="1" filter="url(#cardShadow3)"/>

  <!-- header row -->
  <circle cx="76" cy="62" r="16" fill="#F8F8FC" stroke="#D9D9E3"/>
  <path d="M81 55 L71 62 L81 69" fill="none" stroke="#3D444D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="67" text-anchor="middle" font-size="13" fill="#6B7280">5 / 12</text>
  <rect x="500" y="48" width="84" height="28" rx="14" fill="#EBF7ED"/>
  <text x="542" y="67" text-anchor="middle" font-size="12.5" font-weight="700" fill="#01A11E">Score 3/4</text>

  <!-- avatar -->
  <circle cx="320" cy="160" r="66" fill="#E4EAF2"/>
  <circle cx="320" cy="140" r="24" fill="#B9C6D6"/>
  <path d="M272 205 a48 48 0 0 1 96 0 z" fill="#B9C6D6"/>

  <text x="320" y="252" text-anchor="middle" font-size="15" fill="#6B7280">Who is this?</text>

  <!-- choice buttons -->
  <g>
    <rect x="80" y="278" width="480" height="46" rx="8" fill="#FFFFFF" stroke="#D9D9E3" stroke-width="1.5"/>
    <text x="320" y="306" text-anchor="middle" font-size="14" fill="#3D444D">Alexis Decker</text>
  </g>

  <g>
    <rect x="80" y="334" width="480" height="46" rx="8" fill="#EBF7ED" stroke="#01A11E" stroke-width="2"/>
    <text x="320" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#01A11E">&#10003; Ted Decker</text>
  </g>

  <g>
    <rect x="80" y="390" width="480" height="46" rx="8" fill="#FAEBED" stroke="#D70015" stroke-width="2"/>
    <text x="320" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#D70015">&#10005; Noah Decker</text>
  </g>

  <g>
    <rect x="80" y="446" width="480" height="46" rx="8" fill="#FFFFFF" stroke="#D9D9E3" stroke-width="1.5"/>
    <text x="320" y="474" text-anchor="middle" font-size="14" fill="#3D444D">Francis Dexter</text>
  </g>

  <!-- next button -->
  <rect x="80" y="510" width="480" height="48" rx="8" fill="#2FAE7A"/>
  <text x="320" y="540" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Next &#8594;</text>

  <text x="320" y="586" text-anchor="middle" font-size="11.5" fill="#97A9BA">Multiple Choice mode &#183; tapped answer and correct answer both highlight before advancing</text>
</svg>
